<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Dashboard | Unnat Kisan</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .dashboard {
            padding: 50px 0;
            background: #f5f8f3;
            min-height: calc(100vh - 76px);
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            margin-bottom: 5px;
        }

        .request-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .request-top h3 {
            margin-bottom: 5px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            height: fit-content;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-accepted {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }

        .detail-box {
            background: #f5f8f3;
            padding: 12px;
            border-radius: 10px;
        }

        .detail-box small {
            display: block;
            color: #6b7280;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #b02a37;
        }

        .empty {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 16px;
        }

        @media(max-width: 700px) {
            .request-details {
                grid-template-columns: 1fr;
            }

            .request-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            <span class="logo-icon">🌾</span>
            Unnat Kisan
        </a>

        <nav class="nav-menu">

            <a href="farmer-dashboard.html">
                Dashboard
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="dashboard">

    <div class="container">

        <div class="dashboard-header">

            <h1>Farmer Dashboard</h1>

            <p>
                Manage your crops and incoming purchase requests.
            </p>

        </div>


        <section>

            <h2>Incoming Purchase Requests</h2>

            <div id="requestsContainer">

                <p>Loading requests...</p>

            </div>

        </section>

    </div>

<section class="dashboard-section">
    <div class="section-header">
        <div>
            <h2>My Crops</h2>
            <p>Your listed crops and their current status</p>
        </div>

        <button class="btn btn-primary" onclick="showAddCrop()">
            + Add Crop
        </button>
    </div>

    <div id="myCrops" class="crop-grid">
        <p>Loading crops...</p>
    </div>
</section>


<section id="addCropSection" class="dashboard-section" style="display:none;">
    <div class="section-header">
        <div>
            <h2>Add New Crop</h2>
            <p>List your crop for bulk buyers</p>
        </div>
    </div>

    <form id="cropForm" enctype="multipart/form-data">

        <div class="form-grid">

            <div class="form-group">
                <label>Crop Name</label>
                <input type="text" name="crop_name" required
                       placeholder="e.g. Wheat">
            </div>

            <div class="form-group">
                <label>Harvest Date</label>
                <input type="date" name="harvest_date" required>
            </div>

            <div class="form-group">
                <label>Quality Grade</label>
                <select name="quality_grade" required>
                    <option value="">Select Grade</option>
                    <option value="A">Grade A</option>
                    <option value="B">Grade B</option>
                    <option value="C">Grade C</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" min="1" required>
            </div>

            <div class="form-group">
                <label>Unit</label>
                <select name="quantity_unit">
                    <option value="kg">Kg</option>
                    <option value="quintal">Quintal</option>
                    <option value="ton">Ton</option>
                </select>
            </div>

            <div class="form-group">
                <label>Expected Price / Kg</label>
                <input type="number" name="expected_price_per_kg"
                       min="1" step="0.01" required>
            </div>

            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" required>
            </div>

            <div class="form-group">
                <label>District</label>
                <input type="text" name="district" required>
            </div>

            <div class="form-group">
                <label>City / Village</label>
                <input type="text" name="city" required>
            </div>

            <div class="form-group">
                <label>Crop Photos</label>
                <input type="file" name="photos" multiple accept="image/*">
            </div>

        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"
                      placeholder="Tell buyers about your crop"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            List Crop
        </button>

        <button type="button" class="btn btn-secondary"
                onclick="hideAddCrop()">
            Cancel
        </button>

    </form>
</section>

</main>


<script src="js/farmer-dashboard.js"></script>

</body>

</html>
